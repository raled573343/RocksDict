name: Fix cp314t release wheels and publish (no native rebuild)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp314t-release-assets
  cancel-in-progress: false

jobs:
  repack:
    name: Repack four verified wheels without Rust/C++ compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout pinned packaging and notice files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Cache original binary assets BEFORE any download. Key contains all four
      # original GitHub Release SHA-256 prefixes; never reuse changed binaries.
      - name: Restore cached original release wheels
        uses: actions/cache@v4
        with:
          path: original
          key: cp314t-legal-original-v1-f6617bd2-84fbc81e-414c4a36-ec0e1246

      - name: Download only missing original wheel pairs from existing releases
        shell: bash
        run: |
          set -euo pipefail
          for tag in cp314t-v0.3.29 cp314t-v0.3.29-rocksdb11.8.1; do
            folder="original/$tag"
            count=0
            if [[ -d "$folder" ]]; then
              count="$(find "$folder" -maxdepth 1 -name '*.whl' -type f | wc -l)"
            fi
            if [[ "$count" -ne 2 ]]; then
              rm -rf "$folder"
              mkdir -p "$folder"
              gh release download "$tag" --pattern '*.whl' --dir "$folder"
            else
              echo "Using cached wheels for $tag"
            fi
          done

      - name: Verify originals, embed notices, correct METADATA, rebuild RECORD
        run: |
          python tools/repack_cp314t_licenses.py original legal-preview LICENSES

      - name: Restore free-threaded Python runtime for import smoke
        uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
          architecture: x64

      - name: No-GIL install/import smoke with repacked Linux wheels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, sysconfig
          assert sys.version_info[:2] == (3, 14)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert not sys._is_gil_enabled()
          PY
          for tag in cp314t-v0.3.29 cp314t-v0.3.29-rocksdb11.8.1; do
            wheel="$(find "legal-preview/$tag" -maxdepth 1 -name '*manylinux_2_28_x86_64.whl' -print -quit)"
            test -n "$wheel"
            target="$RUNNER_TEMP/rocksdict-smoke/$tag"
            mkdir -p "$target"
            python -m pip install --no-index --no-deps --target "$target" "$wheel"
            PYTHONPATH="$target" RELEASE_TAG="$tag" python -X gil=0 - <<'PY'
          import os, sys, rocksdict
          assert not sys._is_gil_enabled()
          assert hasattr(rocksdict, "Rdict")
          if "rocksdb11.8.1" in os.environ["RELEASE_TAG"]:
              assert rocksdict.native_rocksdb_version() == (11, 8, 1)
          print("Repacked wheel import OK:", os.environ["RELEASE_TAG"])
          PY
          done

      - name: Report SHA256SUMS for the NEW (different) wheel binaries
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## License-repacked cp314t wheels — verified for release publication"
            echo
            echo "**No native recompilation.** Linux 3.14t was smoke-tested; Windows binary bytes were checked without executing on Windows."
            echo
            echo "**Legal status:** RocksDB Apache-2.0, inherited LevelDB, Snappy, LZ4, Zstd, zlib and bzip2 texts added, and wheel metadata corrected. Full Rust crate/native dependency compliance review remains pending; not legally certified."
            echo
            for tag in cp314t-v0.3.29 cp314t-v0.3.29-rocksdb11.8.1; do
              echo "### $tag"
              echo '~~~'
              cat "legal-preview/$tag/SHA256SUMS"
              echo '~~~'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload repacked preview wheels, grouped by original tag
        uses: actions/upload-artifact@v4
        with:
          name: rocksdict-cp314t-license-preview-${{ github.run_id }}
          path: legal-preview/
          if-no-files-found: error
          retention-days: 30

      - name: Backup BOTH original GitHub Releases before modification
        shell: bash
        run: |
          set -euo pipefail
          for tag in cp314t-v0.3.29 cp314t-v0.3.29-rocksdb11.8.1; do
            mkdir -p "release-backup/$tag"
            gh release download "$tag" --dir "release-backup/$tag"
            gh release view "$tag" --json body --jq .body > "release-backup/$tag/ORIGINAL_RELEASE_NOTES.md"
            test "$(find "release-backup/$tag" -maxdepth 1 -name '*.whl' | wc -l)" -eq 2
            ( cd "release-backup/$tag" && sha256sum -c SHA256SUMS )
            for wheel in original/"$tag"/*.whl; do
              cmp -- "$wheel" "release-backup/$tag/$(basename "$wheel")" || {
                echo "::error::Release $tag no longer matches the original verified wheels. Refusing to publish."
                exit 1
              }
            done
          done

      - name: Persist backups BEFORE any release asset is changed
        uses: actions/upload-artifact@v4
        with:
          name: ORIGINAL-cp314t-releases-backup-${{ github.run_id }}
          path: release-backup/
          retention-days: 90
          if-no-files-found: error

      - name: Update both existing Releases and verify remote SHA256 digests
        shell: bash
        run: |
          set -euo pipefail
          tags=(cp314t-v0.3.29 cp314t-v0.3.29-rocksdb11.8.1)
          rollback() {
            local exit_code="$?"
            trap - ERR INT TERM
            echo "::error::Publish failed (status $exit_code); attempting restoration of BOTH original releases."
            for tag in "\${tags[@]}"; do
              gh release upload "$tag" "release-backup/$tag/"*.whl "release-backup/$tag/SHA256SUMS" --clobber ||
                echo "::error::Automatic restore failed for $tag: backups are preserved as Actions artifact."
              gh release edit "$tag" --notes-file "release-backup/$tag/ORIGINAL_RELEASE_NOTES.md" ||
                echo "::warning::Could not restore original release notes for $tag."
            done
            exit "$exit_code"
          }
          trap rollback ERR INT TERM
          for tag in "\${tags[@]}"; do
            gh release upload "$tag" "legal-preview/$tag/"*.whl "legal-preview/$tag/SHA256SUMS" --clobber
            python - "$tag" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          tag = sys.argv[1]
          root = Path("legal-preview") / tag
          release = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/raled573343/RocksDict/releases/tags/{tag}"], text=True))
          names = {p.name: p for p in root.iterdir() if p.is_file()}
          assert len(names) == 3 and len([x for x in names if x.endswith(".whl")]) == 2
          published = {a["name"]: a for a in release["assets"]}
          assert set(published) == set(names), (sorted(published), sorted(names))
          for name, path in names.items():
              expected = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              assert published[name]["digest"] == expected, (name, published[name]["digest"], expected)
          print("GitHub remote digests verified:", tag)
          PY
            {
              cat "release-backup/$tag/ORIGINAL_RELEASE_NOTES.md"
              echo
              echo "### Updated cp314t wheels — 2026-10-17"
              echo
              echo "Wheel assets repackaged from the exact previously tested native binaries."
              echo "Original .so/.pyd bytes unchanged. Third-party license notices and accurate"
              echo "cp314t METADATA included; RECORD and SHA256SUMS regenerated."
              echo "CI: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
              echo "Full Rust/native dependency license audit is still open."
            } > "release-backup/$tag/UPDATED_RELEASE_NOTES.md"
            gh release edit "$tag" --notes-file "release-backup/$tag/UPDATED_RELEASE_NOTES.md"
            echo "Published and hash-verified: $tag" >> "$GITHUB_STEP_SUMMARY"
          done
          trap - ERR INT TERM
