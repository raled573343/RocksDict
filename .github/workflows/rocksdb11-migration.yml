name: RocksDB 11 migration - manual candidate build

# Deliberately gated: source commits NEVER compile. Workflow-file edits trigger
# one Linux check; a commit carrying [build-wheels] triggers the 2-OS build.
on:
  push:
    branches: [feat/rocksdb-11-8-1-cp314t]
    paths:
      - .github/workflows/rocksdb11-migration.yml
  workflow_dispatch:
    inputs:
      stage:
        description: "First use check-linux; build Windows/Linux wheels only after Rust API is ported"
        required: true
        type: choice
        default: check-linux
        options:
          - check-linux
          - wheels-both
          - test-wheels
      source_run_id:
        description: "Existing run ID holding candidate wheels (test-wheels only; no compilation)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: rocksdb11-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    name: Validate migration branch and dependency versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Assert RocksDB 11 package names (fail before compilation)
        shell: python
        run: |
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("Cargo.toml").read_text())
          wrapper = data["dependencies"]["rocksdb"]
          native = data["dependencies"]["librocksdb-sys"]
          assert wrapper["package"] == "rust-rocksdb"
          assert wrapper["version"] == "=0.53.0"
          assert native["package"] == "rust-librocksdb-sys"
          assert native["version"] == "=0.48.1"
          assert "raw-ptr" in wrapper["features"]
          print("RocksDB 11.8.1 dependency pair selected")

  check-linux:
    name: First compile pass - Linux Rust/PyO3 only
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[build-wheels]')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'check-linux')
    needs: verify-source
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # Commit the exact resolver-generated lockfile to this branch.
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Install free-threaded CPython 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
          architecture: x64
      - name: Restore pinned host Rust 1.91.1 toolchain
        id: host-rustup
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.rustup/toolchains/1.91.1-*
            ~/.rustup/update-hashes/1.91.1-*
          key: host-rustup-1.91.1-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install pinned Rust compiler
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.1'
      - name: Install native build prerequisites
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake pkg-config libssl-dev zlib1g-dev libbz2-dev
          libclang="$(find -L /usr/lib/llvm-* /usr/lib/x86_64-linux-gnu -name 'libclang.so*' -type f 2>/dev/null | head -n 1 || true)"
          if [[ -z "$libclang" ]]; then
            echo "::error::Cannot locate libclang.so after installing libclang-dev"
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
      - name: Restore Rust/C++ compiler artifacts
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rocksdb11-check-linux-rust1911-${{ hashFiles('Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            rocksdb11-check-linux-rust1911-${{ hashFiles('Cargo.toml') }}-
            rocksdb11-check-linux-rust1911-
      - name: Resolve dependencies and update candidate lockfile
        shell: bash
        run: |
          cargo generate-lockfile
          cargo tree -i rust-librocksdb-sys
      - name: Commit resolved RocksDB 11 Cargo.lock without another compiler job
        if: github.ref == 'refs/heads/feat/rocksdb-11-8-1-cp314t'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock unchanged"
          else
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/Cargo.lock?ref=$GITHUB_REF_NAME" --jq '.sha')"
            content="$(base64 -w0 Cargo.lock)"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/Cargo.lock" \
              -f message='build: pin RocksDB 11 Rust dependency resolution' \
              -f content="$content" \
              -f sha="$sha" \
              -f branch="$GITHUB_REF_NAME" --jq '.commit.sha'
            echo "Committed lockfile without triggering a new Actions run"
          fi

      - name: Verify source Python interpreter is no-GIL
        shell: python
        run: |
          import sys, sysconfig
          assert sys.version_info[:2] == (3,14)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert not sys._is_gil_enabled()
      - name: Compile Rust bindings (diagnostic; no wheel or link)
        shell: bash
        run: |
          set -o pipefail
          cargo check --lib --no-default-features --features bindgen-runtime 2>&1 | tee rocksdb11-cargo-check.log
      - name: Upload generated Cargo.lock and diagnostics, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocksdb11-linux-check-${{ github.run_number }}
          path: |
            Cargo.lock
            rocksdb11-cargo-check.log
          if-no-files-found: warn
          retention-days: 14
      - name: Save warmed native build cache even if type check fails
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Save pinned host Rust 1.91.1 toolchain even after failure
        if: always() && steps.host-rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.rustup/toolchains/1.91.1-*
            ~/.rustup/update-hashes/1.91.1-*
          key: host-rustup-1.91.1-${{ runner.os }}-${{ runner.arch }}-v1

  wheels:
    name: Python 3.14t RocksDB 11 wheels - ${{ matrix.platform }}
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-wheels]')) || (github.event_name == 'workflow_dispatch' && inputs.stage == 'wheels-both')
    needs: verify-source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: manylinux_2_28_x86_64
          - runner: windows-2022
            platform: win_amd64
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
          architecture: x64
      - name: Restore pinned host Rust 1.91.1 toolchain
        id: host-rustup
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.rustup/toolchains/1.91.1-*
            ~/.rustup/update-hashes/1.91.1-*
          key: host-rustup-1.91.1-${{ runner.os }}-${{ runner.arch }}-v1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.1'
      - name: Require committed Cargo.lock (no dependency drift)
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Restore native Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-cargo/registry
            .ci-cargo/git
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rocksdb11-wheels-v2-${{ runner.os }}-${{ matrix.platform }}-rust1911-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/rust-rocksdb/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            rocksdb11-wheels-v2-${{ runner.os }}-${{ matrix.platform }}-rust1911-
      - name: Restore Linux RPM and pinned Rust toolchain
        if: runner.os == 'Linux'
        id: linux-dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-dnf
            .ci-rustup
          key: manylinux_2_28-llvm21-rust1911-v1

      - name: Restore Windows LLVM
        if: runner.os == 'Windows'
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/llvm-21.1.3
          key: llvm-21.1.3-windows-2022-x64-v1
      - name: Install LLVM on Windows cache miss
        if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: KyleMayes/install-llvm-action@v2.0.8
        with:
          version: 21.1.3
          directory: ${{ runner.temp }}/llvm-21.1.3
      - name: Verify cached or installed Windows Clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = Join-Path '${{ runner.temp }}' 'llvm-21.1.3'
          if (-not (Test-Path (Join-Path $llvm 'bin/clang-cl.exe'))) {
            throw "LLVM cache or installation is missing clang-cl.exe"
          }
          (Join-Path $llvm 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Report restored dependency and compiled object caches
        shell: python
        env:
          CARGO_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          LLVM_HIT: ${{ steps.llvm-cache.outputs.cache-hit }}
          DNF_HIT: ${{ steps.linux-dependency-cache.outputs.cache-hit }}
          RUSTUP_HIT: ${{ steps.host-rustup.outputs.cache-hit }}
        run: |
          import os
          checks = {
              "Cargo crates + native RocksDB objects": os.getenv("CARGO_HIT", ""),
              "Host Rust 1.91.1 toolchain": os.getenv("RUSTUP_HIT", ""),
              "Windows LLVM 21": os.getenv("LLVM_HIT", ""),
              "Linux RPM + manylinux Rust": os.getenv("DNF_HIT", ""),
          }
          for key, hit in checks.items():
              print(f"{key}: {hit or 'not applicable'}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Dependency/build cache status\\n\\n")
              for key, hit in checks.items():
                  f.write(f"- {key}: **{hit or 'not applicable'}**\\n")
              f.write("\\n")
      - name: Build Linux x64 candidate wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.91.1'
          target: x86_64
          manylinux: '2_28'
          docker-options: >-
            --volume ${{ github.workspace }}/.ci-cargo/registry:/root/.cargo/registry
            --volume ${{ github.workspace }}/.ci-cargo/git:/root/.cargo/git
            --volume ${{ github.workspace }}/.ci-dnf:/var/cache/dnf
            --volume ${{ github.workspace }}/.ci-rustup:/root/.rustup
            --env CARGO_TARGET_DIR=${{ github.workspace }}/target
          args: >-
            --release --locked --out dist --no-default-features
            --features bindgen-runtime --interpreter python3.14t
          before-script-linux: |
            dnf --setopt=keepcache=1 install -y clang clang-devel llvm-devel cmake make perl
      - name: Build Windows x64 candidate wheel
        if: runner.os == 'Windows'
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: '1.91.1'
          target: x64
          args: >-
            --release --locked --out dist --no-default-features
            --features bindgen-runtime --interpreter python3.14t
        env:
          LIBCLANG_PATH: ${{ runner.temp }}/llvm-21.1.3/lib
          CC: ${{ runner.temp }}/llvm-21.1.3/bin/clang-cl
          CXX: ${{ runner.temp }}/llvm-21.1.3/bin/clang-cl
          AR: ${{ runner.temp }}/llvm-21.1.3/bin/llvm-lib
      - name: Validate ABI and wheel metadata
        run: python tools/check_python_314t_wheel.py --wheel-only --platform ${{ matrix.platform }}
      - name: Offline install of newly built wheel
        run: |
          python -m pip install --no-index --no-deps --only-binary=:all: --find-links dist --force-reinstall rocksdict
      - name: Check no-GIL import, multithreaded access and persistence
        run: python tools/check_python_314t_wheel.py --platform ${{ matrix.platform }}

      # This deliberately precedes ALL regression tests: a crash must not
      # discard the already compiled binary, nor force a native recompilation
      # just to reproduce it. Candidate artifacts are NEVER published.
      - name: Preserve unverified wheel for no-build diagnostic reruns
        uses: actions/upload-artifact@v4
        with:
          name: candidate-rocksdict11-${{ matrix.platform }}-${{ github.run_id }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

      - name: Focused RocksDB11 regression tests with crash traceback
        run: python -X gil=0 -X faulthandler -m unittest -v test.test_rocksdb11

      - name: Existing Python unit tests with crash traceback
        run: python -X gil=0 -X faulthandler -m unittest discover -v -s test
      - name: Upload passing candidate wheels
        uses: actions/upload-artifact@v4
        with:
          name: rocksdict-11.8.1-314t-${{ matrix.platform }}-${{ github.run_number }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
      - name: Save cold Windows LLVM installation
        if: always() && runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/llvm-21.1.3
          key: llvm-21.1.3-windows-2022-x64-v1

      - name: Save Linux RPM and Rust toolchain caches
        if: always() && runner.os == 'Linux' && steps.linux-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci-dnf
            .ci-rustup
          key: manylinux_2_28-llvm21-rust1911-v1

      - name: Save native build cache even after failing tests
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci-cargo/registry
            .ci-cargo/git
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Save pinned host Rust 1.91.1 toolchain even after failure
        if: always() && steps.host-rustup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.rustup/toolchains/1.91.1-*
            ~/.rustup/update-hashes/1.91.1-*
          key: host-rustup-1.91.1-${{ runner.os }}-${{ runner.arch }}-v1

  test-wheels:
    name: Re-test existing binary, NO native compile - ${{ matrix.platform }}
    # Explicit manual stage; downloaded wheels MUST match a verified source run.
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'test-wheels'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: manylinux_2_28_x86_64
          - runner: windows-2022
            platform: win_amd64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
          architecture: x64
      - name: Verify source run id for artifact download
        shell: python
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          import os
          run_id = os.environ.get("SOURCE_RUN_ID", "")
          if not run_id.isascii() or not run_id.isdecimal() or int(run_id) <= 0:
              raise SystemExit("An existing numeric source_run_id is required")

      # No Rust/Clang/Docker/dependency downloads: these are already built.
      # setup-python uses its hosted tool cache, pip installs without an index.
      - name: Download prior run's unverified candidate wheel
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          name: candidate-rocksdict11-${{ matrix.platform }}-${{ inputs.source_run_id }}
          path: dist
      - name: Install candidate wheel offline
        run: python -m pip install --no-index --no-deps --only-binary=:all: --find-links dist --force-reinstall rocksdict
      - name: Check GIL stays disabled and RocksDB 11 ABI
        shell: python
        run: |
          import rocksdict
          import sys
          import sysconfig
          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert not sys._is_gil_enabled()
          assert rocksdict.native_rocksdb_version() == (11, 8, 1)
      - name: Focused CF regression with native crash traceback
        run: >-
          python -X gil=0 -X faulthandler -m unittest discover
          -v -s test -p test_rdict.py -k test_column_families_custom_options_auto_reopen
      - name: Run RocksDB11 regression tests
        run: python -X gil=0 -X faulthandler -m unittest -v test.test_rocksdb11
      - name: Run full regression suite
        run: python -X gil=0 -X faulthandler -m unittest discover -v -s test

  publish:
    name: Publish tested RocksDB 11.8.1 GitHub Release
    needs: [verify-source, wheels]
    if: >-
      needs.verify-source.result == 'success' &&
      needs.wheels.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: cp314t-v0.3.29-rocksdb11.8.1
    steps:
      - name: Checkout exact tested application source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch only this run's two passing wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rocksdict-11.8.1-314t-*-${{ github.run_number }}
          merge-multiple: true
          path: dist

      - name: Independently verify both wheel ABI tags and checksums
        run: python tools/rocksdb11_release.py --dist dist --project pyproject.toml

      - name: Publish exactly one versioned GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## RocksDict 0.3.29 + RocksDB 11.8.1"
            echo
            echo "Native engine: **RocksDB 11.8.1**; Rust binding: **rust-rocksdb 0.53.0**."
            echo "Python ABI: **CPython 3.14t, free-threaded**, Windows x64 and Linux x86-64 (glibc 2.28+)."
            echo
            echo "These are separate experimental RocksDB 11 binaries; the official upstream version stays unchanged."
            echo "Both wheels passed build, local no-index install, no-GIL smoke, native RocksDB version and unit tests."
            echo "Tested commit: \`$GITHUB_SHA\`; Actions run: \`#$GITHUB_RUN_ID\`."
            echo "SHA256SUMS contains cryptographic hashes for both wheel files."
            echo
            echo "Do not downgrade an on-disk DB modified by RocksDB 11 with RocksDB 9."
          } > release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            existing="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$existing" != "true" ]]; then
              echo "::error::Published release already exists; refusing overwrite."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/*.whl dist/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/*.whl dist/SHA256SUMS \
              --draft --target "$GITHUB_SHA" \
              --title "RocksDict 0.3.29 + RocksDB 11.8.1 — CPython 3.14t x64" \
              --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
