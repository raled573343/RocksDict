[package]
name = "RocksDict"
version = "0.3.29"
edition = "2021"
description = "Rocksdb Python Binding"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rocksdict"
crate-type = ["cdylib"]

[[bin]]
name = "create_cf_db"
path = "bin/create-cf-db/main.rs"
test = false

[dependencies]
# RocksDB 11.8.1 backend: keep Rust import names via Cargo package aliases.
# The 0.53.0 wrapper and 0.48.1+11.8.1 native crate are one compatible pair.
# Pin exact releases to avoid silently updating the native engine.
# A change to this Cargo manifest initiates only a single-platform type check.
rocksdb = { package = "rust-rocksdb", version = "=0.53.0", default-features = false, features = [
    "snappy",
    "lz4",
    "zstd",
    "zlib",
    "bzip2",
    "raw-ptr",
    "multi-threaded-cf",
] }
librocksdb-sys = { package = "rust-librocksdb-sys", version = "=0.48.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
libc = "0.2"

[features]
default = ["bindgen-runtime", "lto"]
bindgen-runtime = ["rocksdb/bindgen-runtime"]
bindgen-static = ["rocksdb/bindgen-static"]
lto = ["rocksdb/lto"]

[dependencies.pyo3]
version = "0.27"
features = ["py-clone", "extension-module", "num-bigint"]

[profile.release]
codegen-units = 1
debug = false
lto = "thin"
opt-level = 3
